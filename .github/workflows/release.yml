# Release pipeline — triggered by pushing a version tag (e.g. v0.13.2-zh.1).
#
# Flow:
#   1. Tag push  →  the shared test suite (tests.yml); nothing builds unless
#      it passes
#   2. Builds the Windows installer (.msi + NSIS .exe) on windows-latest
#   3. Uploads the artefacts to a draft GitHub Release
#   4. You review the draft, then publish manually
#
# Manual run (Actions → Release → Run workflow, or
#   gh workflow run release.yml --ref <branch> -f tag=v0.13.2-zh.1):
#   builds the selected branch/ref into a draft release named by `tag`,
#   created at that commit. Delete the draft afterwards if it was a dry run.
#
# Platform produced:
#   Windows   →  .msi + .exe (NSIS) installer
#
# ── Prerequisites ─────────────────────────────────────────────────────────────
# 1. Push a semver tag:
#      git tag v0.13.2-zh.1 && git push origin v0.13.2-zh.1
#
# 2. The version in src-tauri/tauri.conf.json and src-tauri/Cargo.toml must
#    match the tag's `MAJOR.MINOR.PATCH` prefix (everything before the first
#    `-`). Update both before tagging.
#
# 3. In-app updates are disabled in this fork (`plugins.updater.endpoints` is
#    empty in tauri.conf.json), so no updater signing key is needed and no
#    `latest.json` feed is produced. Install a newer build by downloading it
#    from the release page.
# ──────────────────────────────────────────────────────────────────────────────

name: Release

# One run per tag: two runs uploading into the same draft would interleave.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  # A manual run names its release by the `tag` input; `github.ref_name`
  # would be the branch there.
  TAG: ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'       # v1.2.3
      - 'v[0-9]+.[0-9]+.[0-9]+-*'     # v0.13.2-zh.1
  workflow_dispatch:                    # allow manual trigger from Actions UI
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.13.2-zh.1)'
        required: true

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  build:
    name: build · windows-x64
    needs: test             # never publish a release the test suite rejects
    runs-on: windows-latest
    permissions:
      contents: write       # needed to create / update the GitHub Release

    steps:
      - uses: actions/checkout@v5

      # ── Node (Tauri CLI is an npm dev-dep) ──────────────────────────────────
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      # ── Rust ────────────────────────────────────────────────────────────────
      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artefacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-windows-x64

      # ── Node deps (Tauri CLI) ───────────────────────────────────────────────
      - name: npm ci
        run: npm ci

      # ── Build + publish ─────────────────────────────────────────────────────
      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.TAG }}
          releaseName: 'OMP Desktop 中文版 ${{ env.TAG }}'
          releaseBody: |
            ## OMP Desktop 中文版 ${{ env.TAG }}

            基于 [apoc/omp-desktop](https://github.com/apoc/omp-desktop) v0.13.2 的简体中文汉化构建，发布在 [roots2001/omp-desktop-zh](https://github.com/roots2001/omp-desktop-zh)。

            ### 安装
            | 平台 | 文件 |
            |------|------|
            | Windows | `.msi`（推荐）或 `.exe`（NSIS） |

            **Windows：** 若 SmartScreen 拦截安装包，点 _更多信息 → 仍要运行_。

            ### 运行要求
            - 需要安装 [oh-my-pi](https://github.com/can1357/oh-my-pi)（`omp`）并加入 `PATH`。

            ### 说明
            - 本构建关闭了应用内自动更新，升级请下载新版本安装包覆盖安装。
            - 本构建未做代码签名。
          releaseDraft: true        # publish manually after reviewing artefacts
          prerelease: ${{ contains(env.TAG, '-') }}
          args: --config src-tauri/tauri.dist.conf.json
